<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blunder Lens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px 12px 12px;
      background: #262421;
      color: #e0d0b0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* outer layout: rank-labels | board+file-labels */
    #board-section {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }

    #rank-labels {
      width: 18px;
      height: 400px;
      display: flex;
      flex-direction: column;
    }

    .rank-lbl {
      width: 18px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #9a8a7a;
      user-select: none;
    }

    #board-col {
      display: flex;
      flex-direction: column;
    }

    #board-wrap {
      position: relative;
      width: 400px;
      height: 400px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 50px);
      grid-template-rows: repeat(8, 50px);
      width: 400px;
      height: 400px;
    }

    .sq {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 39px;
      line-height: 1;
      user-select: none;
    }

    .light { background: #f0d9b5; }
    .dark  { background: #b58863; }
    .sq.hl { background: rgba(205, 210, 80, 0.82) !important; }
    .sq.lm { background: rgba(170, 162, 58, 0.52) !important; }

    #file-labels {
      width: 400px;
      height: 18px;
      display: flex;
      flex-direction: row;
    }

    .file-lbl {
      width: 50px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #9a8a7a;
      user-select: none;
    }

    #arrows {
      position: absolute;
      top: 0; left: 0;
      width: 400px;
      height: 400px;
      pointer-events: none;
    }

    #caption {
      max-width: 436px;
      font-size: 13px;
      color: #b0a080;
      text-align: center;
      line-height: 1.5;
    }

    #error-msg {
      width: 418px;
      padding: 14px 16px;
      color: #f87171;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      background: #2a1818;
      border-radius: 4px;
    }

    #debug-panel {
      width: 436px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }
    #debug-panel summary {
      cursor: pointer;
      color: #504840;
      padding: 2px 0;
      list-style: none;
    }
    #debug-panel summary::before { content: '\25B6 '; font-size: 8px; }
    #debug-panel[open] summary::before { content: '\25BC '; font-size: 8px; }
    #debug-out {
      white-space: pre-wrap;
      word-break: break-all;
      margin: 4px 0 0;
      color: #605040;
      background: #1e1c1a;
      padding: 6px 8px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="board-section">
    <div id="rank-labels"></div>
    <div id="board-col">
      <div id="board-wrap">
        <div id="board"></div>
        <svg id="arrows" viewBox="0 0 400 400">
          <defs>
            <marker id="ah" markerWidth="5" markerHeight="5"
                    refX="2.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L5,2.5 L0,5 Z" fill="rgba(255,180,0,0.92)" />
            </marker>
          </defs>
        </svg>
      </div>
      <div id="file-labels"></div>
    </div>
  </div>

  <div id="caption"></div>

  <details id="debug-panel">
    <summary>debug</summary>
    <pre id="debug-out">-</pre>
  </details>

  <script>
    var ALL_FILES = ['a','b','c','d','e','f','g','h'];

    var UNICODE = {
      'K': '\u2654', 'Q': '\u2655', 'R': '\u2656', 'B': '\u2657', 'N': '\u2658', 'P': '\u2659',
      'k': '\u265A', 'q': '\u265B', 'r': '\u265C', 'b': '\u265D', 'n': '\u265E', 'p': '\u265F'
    };

    function parseFen(fen) {
      var placement = fen.split(' ')[0];
      var rows = placement.split('/');
      var board = {};
      for (var rankIdx = 0; rankIdx < 8; rankIdx++) {
        var rank = 8 - rankIdx;
        var fileIdx = 0;
        var row = rows[rankIdx] || '';
        for (var i = 0; i < row.length; i++) {
          var ch = row[i];
          if (ch >= '1' && ch <= '8') {
            fileIdx += parseInt(ch, 10);
          } else {
            board[ALL_FILES[fileIdx] + rank] = ch;
            fileIdx++;
          }
        }
      }
      return board;
    }

    function squareCenter(sq, orientation) {
      var file = ALL_FILES.indexOf(sq[0]);
      var rank = parseInt(sq[1], 10) - 1;
      var col = (orientation === 'black') ? 7 - file : file;
      var row = (orientation === 'black') ? rank : 7 - rank;
      return { x: (col + 0.5) * 50, y: (row + 0.5) * 50 };
    }

    function renderCoords(orientation) {
      var rankEl = document.getElementById('rank-labels');
      var fileEl = document.getElementById('file-labels');

      var ranks = orientation === 'black'
        ? [1,2,3,4,5,6,7,8]
        : [8,7,6,5,4,3,2,1];
      var files = orientation === 'black'
        ? ['h','g','f','e','d','c','b','a']
        : ['a','b','c','d','e','f','g','h'];

      rankEl.innerHTML = '';
      fileEl.innerHTML = '';

      for (var ri = 0; ri < 8; ri++) {
        var rd = document.createElement('div');
        rd.className = 'rank-lbl';
        rd.textContent = ranks[ri];
        rankEl.appendChild(rd);
      }
      for (var fi = 0; fi < 8; fi++) {
        var fd = document.createElement('div');
        fd.className = 'file-lbl';
        fd.textContent = files[fi];
        fileEl.appendChild(fd);
      }
    }

    function renderArrows(arrows, orientation) {
      var svg = document.getElementById('arrows');
      var toRemove = svg.querySelectorAll('[data-arrow]');
      for (var i = 0; i < toRemove.length; i++) svg.removeChild(toRemove[i]);
      if (!arrows || arrows.length === 0) return;

      for (var ai = 0; ai < arrows.length; ai++) {
        var arrow = arrows[ai];
        if (!arrow.from || !arrow.to) continue;
        var from = squareCenter(arrow.from, orientation);
        var to   = squareCenter(arrow.to,   orientation);
        var dx = to.x - from.x;
        var dy = to.y - from.y;
        var len = Math.sqrt(dx * dx + dy * dy);
        if (len < 1) continue;

        var shorten = 14;
        var tx = to.x - (dx / len) * shorten;
        var ty = to.y - (dy / len) * shorten;

        var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', tx);
        line.setAttribute('y2', ty);
        line.setAttribute('stroke', 'rgba(255,180,0,0.88)');
        line.setAttribute('stroke-width', '7');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('marker-end', 'url(#ah)');
        line.setAttribute('data-arrow', '1');
        svg.appendChild(line);
      }
    }

    function renderBoard(selected, source) {
      var boardEl   = document.getElementById('board');
      var captionEl = document.getElementById('caption');
      var wrapEl    = document.getElementById('board-wrap');

      var oldErr = document.getElementById('error-msg');
      if (oldErr) oldErr.parentNode.removeChild(oldErr);

      if (!selected || !selected.fen) {
        boardEl.innerHTML = '';
        renderArrows([], 'white');
        renderCoords('white');
        captionEl.textContent = '';
        var errDiv = document.createElement('div');
        errDiv.id = 'error-msg';
        errDiv.textContent = 'No data received. window.openai.toolOutput is null.\nsource: ' + source;
        wrapEl.appendChild(errDiv);
        updateDebug(selected, source);
        return;
      }

      var orientation = selected.orientation || 'white';
      var pieces      = parseFen(selected.fen);

      var highlights = {};
      var hlArr = selected.highlights || [];
      for (var i = 0; i < hlArr.length; i++) highlights[hlArr[i]] = true;

      var lastMoveSquares = {};
      if (selected.lastMove) {
        lastMoveSquares[selected.lastMove.from] = true;
        lastMoveSquares[selected.lastMove.to]   = true;
      }

      var ranks = orientation === 'black'
        ? [1,2,3,4,5,6,7,8]
        : [8,7,6,5,4,3,2,1];
      var files = orientation === 'black'
        ? ['h','g','f','e','d','c','b','a']
        : ['a','b','c','d','e','f','g','h'];

      boardEl.innerHTML = '';

      for (var ri = 0; ri < ranks.length; ri++) {
        var rank = ranks[ri];
        for (var fi = 0; fi < files.length; fi++) {
          var file = files[fi];
          var sq   = file + rank;
          var fileNum = ALL_FILES.indexOf(file);
          var isLight = (fileNum + rank) % 2 === 1;

          var div = document.createElement('div');
          div.className = 'sq ' + (isLight ? 'light' : 'dark');

          if (highlights[sq])            div.classList.add('hl');
          else if (lastMoveSquares[sq])  div.classList.add('lm');

          var piece = pieces[sq];
          if (piece) {
            div.textContent = UNICODE[piece] || piece;
            var isWhitePiece = (piece >= 'A' && piece <= 'Z');
            if (isWhitePiece) {
              div.style.color = '#ffffff';
              div.style.textShadow = '0 1px 3px rgba(0,0,0,0.85), 0 0 3px rgba(0,0,0,0.6)';
            } else {
              div.style.color = '#1a1208';
              div.style.textShadow = '0 1px 2px rgba(255,255,255,0.12)';
            }
          }

          boardEl.appendChild(div);
        }
      }

      renderCoords(orientation);
      renderArrows(selected.arrows || [], orientation);
      captionEl.textContent = selected.caption || '';
      updateDebug(selected, source);
    }

    function updateDebug(selected, source) {
      var el = document.getElementById('debug-out');
      el.textContent = JSON.stringify({
        source: source,
        fen: selected ? selected.fen : null,
        nonce: selected ? (selected.debugNonce || '').slice(0,8) : null,
        hasWindowOpenAI: !!(window.openai),
        windowOpenAIKeys: Object.keys(window.openai || {})
      }, null, 2);
    }

    function readSelected(globals) {
      return (
        (globals && globals.toolOutput != null ? globals.toolOutput : null) ||
        (window.openai && window.openai.toolOutput != null ? window.openai.toolOutput : null) ||
        (globals && globals.toolInput != null ? globals.toolInput : null) ||
        (window.openai && window.openai.toolInput != null ? window.openai.toolInput : null) ||
        null
      );
    }

    renderBoard(readSelected(null), 'initial:window.openai.toolOutput');

    window.addEventListener('openai:set_globals', function(event) {
      var globals = (event.detail && event.detail.globals) ? event.detail.globals : {};
      renderBoard(readSelected(globals), 'openai:set_globals');
    });
  </script>
</body>
</html>
